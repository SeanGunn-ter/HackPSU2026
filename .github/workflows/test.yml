name: tests

on:
  push:
    branches: ["main", "a/**", "b/**", "kevin"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  pytest:
    name: py${{ matrix.python }} / pandas ${{ matrix.pandas }}
    runs-on: ubuntu-latest
    env:
      # A push to a feature branch gets the fast suite for a quick signal. Anything that
      # gates main -- a pull request, a push to main, a manual run -- gets all of it.
      SLOW: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && '' || '--slow' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        # 3.1 is not optional coverage: merge.py probes this pandas for inner-merge row
        # order and only 3.1+ takes the fully incremental branch (see _inner_keeps_left_order).
        pandas: ["2.1.*", "2.2.*", "3.0.*", "3.1.*"]
        exclude:
          # pandas 3.0 and 3.1 require Python >= 3.11
          - python: "3.10"
            pandas: "3.0.*"
          - python: "3.10"
            pandas: "3.1.*"
        include:
          # pandas 2.1 was built against numpy 1.x; numpy 2 breaks it at import
          - python: "3.10"
            pandas: "2.1.*"
            numpy: "<2"
          - python: "3.12"
            pandas: "2.1.*"
            numpy: "<2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pandas==${{ matrix.pandas }}" ${{ matrix.numpy && format('"numpy{0}"', matrix.numpy) || '' }}

      - name: Versions
        run: python -c "import sys, pandas, numpy; print(sys.version); print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

      # conftest.py sets INCPANDAS_VERIFY=1, so every materialisation is checked
      # against a from-scratch plain pandas run.
      - name: Test
        run: python -m pytest -q $SLOW
