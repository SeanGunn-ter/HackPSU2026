name: tests

on:
  push:
    branches: ["main", "a/**", "b/**", "kevin"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  pytest:
    name: py${{ matrix.python }} / pandas ${{ matrix.pandas }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        pandas: ["2.1.*", "2.2.*", "3.0.*"]
        exclude:
          # pandas 3.0 requires Python >= 3.11
          - python: "3.10"
            pandas: "3.0.*"
        include:
          # pandas 2.1 was built against numpy 1.x; numpy 2 breaks it at import
          - python: "3.10"
            pandas: "2.1.*"
            numpy: "<2"
          - python: "3.12"
            pandas: "2.1.*"
            numpy: "<2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pandas==${{ matrix.pandas }}" ${{ matrix.numpy && format('"numpy{0}"', matrix.numpy) || '' }}

      - name: Versions
        run: python -c "import sys, pandas, numpy; print(sys.version); print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

      # conftest.py sets INCPANDAS_VERIFY=1, so every materialisation is checked
      # against a from-scratch plain pandas run.
      - name: Test
        run: python -m pytest -q
