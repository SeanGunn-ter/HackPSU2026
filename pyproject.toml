[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "incpandas"
version = "0.1.0"
description = "Drop-in pandas wrapper: rerun on appended data and only process the delta."
requires-python = ">=3.10"
dependencies = ["pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["incpandas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
